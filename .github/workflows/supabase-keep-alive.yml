name: Supabase Keep-Alive
on:
  schedule:
    - cron: "0 6 * * 1,4"   # every Monday & Thursday, 06:00 UTC — well under the 7-day pause window
  workflow_dispatch: {}       # allows manually triggering a ping from the GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
